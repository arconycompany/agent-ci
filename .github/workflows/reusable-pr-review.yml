name: Reusable PR Review

on:
  workflow_call:
    inputs:
      base_ref:
        description: 'Base branch to compare against'
        required: false
        type: string
        default: 'main'
    secrets:
      OPENAI_API_KEY:
        required: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install openai
      
      - name: Download review script
        run: |
          curl -o review-pr.sh https://raw.githubusercontent.com/arconycompany/agent-ci/main/review-pr.sh
          chmod +x review-pr.sh
      
      - name: Run PR review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          git diff origin/${{ inputs.base_ref }}...HEAD | ./review-pr.sh > findings.json
          echo "📊 Review Results:"
          cat findings.json | python3 -m json.tool
      
      - name: Check for critical findings
        run: |
          CRITICAL_COUNT=$(cat findings.json | python3 -c "import sys, json; findings = json.load(sys.stdin); print(sum(1 for f in findings if f.get('severity') == 'critical'))")
          echo "Critical issues found: $CRITICAL_COUNT"
          
          if [ "$CRITICAL_COUNT" -gt 0 ]; then
            echo "❌ PR has critical issues that must be fixed!"
            cat findings.json | python3 -c "import sys, json; findings = json.load(sys.stdin); [print(f\"::error file={f['file']},line={f['line']}::{f['category'].upper()}: {f['message']}\") for f in findings if f.get('severity') == 'critical']"
            exit 1
          else
            echo "✅ No critical issues found"
          fi
      
      - name: Upload findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-review-findings
          path: |
            findings.json
            review_meta.json
